name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Work out version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Vet
        run: GOOS=windows GOARCH=amd64 go vet ./...

      - name: Build Windows executables
        env:
          CGO_ENABLED: "0"
          GOOS: windows
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -H windowsgui -X main.version=${{ steps.ver.outputs.version }} -X main.repoURL=${{ github.server_url }}/${{ github.repository }}"
          GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/DownloadKeepAwake.exe .
          GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o dist/DownloadKeepAwake-arm64.exe .
          cd dist && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DownloadKeepAwake-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DownloadKeepAwake.exe
            dist/DownloadKeepAwake-arm64.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true

# Builds the Windows app on GitHub's machines and publishes it as a Release.
# Installed copies of Download Keep-Awake see the new release and offer "Update now".
#
# Every change pushed to the main branch becomes a new version automatically:
# the last release number +1 (1.4.0 -> 1.4.1). To jump to a bigger number, put it
# in VERSION (e.g. 2.0.0) and it's used once it's higher than the last release.
# Changes to the README or LICENSE alone don't make a release. Re-running the
# workflow for the same commit repairs that release instead of making a new one.
name: Build and release Download Keep-Awake

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Pick the version number
        id: ver
        shell: bash
        run: |
          valid() { [[ "$1" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; }
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"; echo "skip_publish=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          RELEASES=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft|not) | "\(.tag_name) \(.target_commitish)"' 2>/dev/null || true)

          # This exact commit already released? Reuse its number (and repair it if files are missing).
          SAME=$(echo "$RELEASES" | awk -v sha="$GITHUB_SHA" '$2==sha {print $1; exit}')
          if [ -n "$SAME" ]; then
            V=${SAME#v}
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$SAME" --jq '.assets[].name' | grep -qx "SHA256SUMS.txt"; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::This commit is already released as $SAME."
            fi
          else
            LAST=$(echo "$RELEASES" | awk '{print $1}' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [ -n "$LAST" ]; then
              IFS=. read -r MA MI PA <<< "$LAST"; NEXT="$MA.$MI.$((PA+1))"
            else
              NEXT="1.0.0"
            fi
            FLOOR=$(tr -d ' \r\n' < VERSION 2>/dev/null || true)
            V=$NEXT
            if valid "$FLOOR" && [ "$(printf '%s\n%s\n' "$FLOOR" "$NEXT" | sort -V | tail -1)" = "$FLOOR" ]; then V=$FLOOR; fi
          fi
          valid "$V" || { echo "::error::Couldn't work out a version number (got \"$V\")"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Check the code
        if: steps.ver.outputs.skip != 'true'
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=arm64 go vet ./...

      - name: Build v${{ steps.ver.outputs.version }}
        if: steps.ver.outputs.skip != 'true'
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: windows
        run: |
          V="${{ steps.ver.outputs.version }}"
          LDFLAGS="-s -w -H windowsgui -X main.version=$V -X main.repoURL=https://github.com/$GITHUB_REPOSITORY"
          mkdir -p dist
          GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/DownloadKeepAwake.exe .
          GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o dist/DownloadKeepAwake-arm64.exe .
          cd dist && sha256sum DownloadKeepAwake.exe DownloadKeepAwake-arm64.exe > SHA256SUMS.txt && cat SHA256SUMS.txt && ls -l

      - uses: actions/upload-artifact@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          name: DownloadKeepAwake-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Publish v${{ steps.ver.outputs.version }}
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.skip_publish != 'true'
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          cd dist
          FILES="DownloadKeepAwake.exe DownloadKeepAwake-arm64.exe SHA256SUMS.txt"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "v$V" $FILES --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$V" $FILES --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Download Keep-Awake $V" \
              --notes "$(git log -1 --pretty=%s "$GITHUB_SHA")

          New install: download **DownloadKeepAwake.exe** and run it (**DownloadKeepAwake-arm64.exe** on Snapdragon/ARM PCs). Already installed: right-click the tray icon → **Update now**."
          fi

      - name: Confirm the release is complete
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.skip_publish != 'true'
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          NAMES=$(gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) \(.size)"')
          echo "$NAMES"
          for f in DownloadKeepAwake.exe DownloadKeepAwake-arm64.exe SHA256SUMS.txt; do
            echo "$NAMES" | grep -q "^$f " || { echo "::error::$f did not reach the release"; exit 1; }
          done
